[package]
name = "scn-sync-relay"
version = "0.1.2"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
description = "Automerge sync relay for the Shared Computer Network"
repository = "https://github.com/Z-Space-Society/scn-sync-relay"

[dependencies]
samod = { version = "0.15", features = ["tokio", "axum"] }
# The version samod is built on: folder documents are read and written with it.
automerge = "0.12"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
futures = "0.3"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
subtle = "2"
# The version samod uses, for reading the sync protocol's message envelope.
minicbor = { version = "1", features = ["std"] }
# Pure-Rust crypto for token checks, and ring for TLS (the provider sqlx already
# builds), so the deploy's cold build needs no second C crypto library.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "json",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The MCP service: Streamable HTTP as a tower service, mounted on axum.
rmcp = { version = "3", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
schemars = "1"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `#[sqlx::test]` gives each test its own database on the server DATABASE_URL
# points at.
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate"] }
# A plain websocket client: the test sync client dials with it.
tokio-tungstenite = "0.29"
