[package]
name = "scn-sync-relay"
version = "0.1.2"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
description = "Automerge sync relay for the Shared Computer Network"
repository = "https://github.com/Z-Space-Society/scn-sync-relay"

[dependencies]
samod = { version = "0.15", features = ["tokio", "axum"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
# Pure-Rust crypto for token checks, and ring for TLS (the provider sqlx already
# builds), so the deploy's cold build needs no second C crypto library.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "json",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
